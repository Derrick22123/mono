openapi: 3.1.0
info:
  title: Agent Chat API
  version: 1.0.0
  description: |
    v1 HTTP contract for the mono agent chat app.
    Browser sends full thread history; backend streams assistant reply via SSE.

servers:
  - url: http://localhost:8000
    description: Local backend (default Uvicorn)

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Health and chat readiness check
      tags: [system]
      responses:
        "200":
          description: Process is running; inspect body.status for chat readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    status: healthy
                    version: "1.0.0"
                    checks:
                      process: ok
                      model_credentials: ok
                      model_reachable: ok
                degraded:
                  value:
                    status: degraded
                    version: "1.0.0"
                    checks:
                      process: ok
                      model_credentials: missing
                      model_reachable: skipped

  /v1/chat/stream:
    post:
      operationId: streamChat
      summary: Stream an assistant reply for the submitted thread
      description: |
        Accepts the full ordered conversation. Returns `text/event-stream` with
        JSON payloads per SSE `data:` line. Event types communicated via `event:` field.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatStreamRequest"
            example:
              messages:
                - role: user
                  content: 你好，請用繁體中文自我介紹。
      responses:
        "200":
          description: SSE stream of assistant tokens
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE format. Each event:
                  - `event: delta` + `data: {"content":"<text chunk>"}`
                  - `event: done` + `data: {"finish_reason":"stop"}`
                  - `event: error` + `data: {"code":"...","message":"..."}`
              examples:
                stream:
                  value: |
                    event: delta
                    data: {"content":"你好"}

                    event: delta
                    data: {"content":"！"}

                    event: done
                    data: {"finish_reason":"stop"}
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Model unavailable (missing credentials or provider error before stream starts)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ChatMessage:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000

    ChatStreamRequest:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChatMessage"
      description: Full thread history including the latest user message as last item

    HealthResponse:
      type: object
      required: [status, version, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        version:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
        checks:
          type: object
          required: [process, model_credentials, model_reachable]
          additionalProperties: false
          properties:
            process:
              type: string
              enum: [ok]
            model_credentials:
              type: string
              enum: [ok, missing, invalid]
            model_reachable:
              type: string
              enum: [ok, failed, skipped]

    ErrorResponse:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          examples: [validation_error, model_unavailable, internal_error]
        message:
          type: string
          description: Traditional Chinese user-facing message when proxied to UI

    StreamDeltaEvent:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string

    StreamDoneEvent:
      type: object
      required: [finish_reason]
      additionalProperties: false
      properties:
        finish_reason:
          type: string
          enum: [stop, length, error]

    StreamErrorEvent:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
